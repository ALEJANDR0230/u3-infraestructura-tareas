services:
  - type: web
    name: u3-tareas-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: APP_ENV
        value: Render gratuito
      - key: DATABASE_URL
        fromDatabase:
          name: u3-tareas-db
          property: connectionString
databases:
  - name: u3-tareas-db
    plan: free
    region: oregon
    databaseName: tareas
    user: tareas
    ipAllowList: []
  
